services:
  api:
    environment:
      APP_ENV: development
      PROFILE_STORAGE_ROOT: /var/lib/tramas/media
    volumes:
      - profile_media_dev:/var/lib/tramas/media
  worker:
    environment:
      APP_ENV: development
  caddy:
    environment:
      SITE_ADDRESS: http://:8080
    ports:
      - "127.0.0.1:${DEV_HTTP_PORT:-8080}:8080"
volumes:
  profile_media_dev:
