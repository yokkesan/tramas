<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>tramas Mobile Mockup</title><style>
*{box-sizing:border-box}body{margin:0;background:#e9e9e6;color:#202020;font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN",sans-serif}button,input,textarea{font:inherit}button{cursor:pointer}.preview{min-height:100vh;display:grid;place-items:center;padding:18px}.phone{width:min(100%,390px);height:min(810px,93vh);min-height:550px;background:#f6f6f3;border:5px solid #202020;border-radius:32px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 18px 55px #0002}.status{background:#121212;color:white;font-size:11px;padding:9px 22px;display:flex;justify-content:space-between}.header{background:#121212;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:11px 16px;min-height:57px}.logo{font-size:27px;font-weight:950;letter-spacing:-2px;color:#ffdc27}.content{flex:1;overflow:auto;padding:16px}.nav{display:flex;background:#141414;padding:8px 2px 13px;justify-content:space-around}.nav button{border:0;background:none;color:#aaa;font-size:10px;width:20%;display:flex;flex-direction:column;align-items:center;gap:3px}.nav button.active{color:#ffdc27}.nav b{font-size:23px}.card{background:#fff;border:1px solid #e9e9e9;border-radius:14px;padding:15px;margin-bottom:12px}.section{font-size:15px;font-weight:850;margin:17px 0 10px}.muted{font-size:11px;color:#7e8289}.btn{border:0;border-radius:9px;background:#ffda2d;color:#181818;font-size:12px;font-weight:850;padding:10px 13px}.btn.secondary{background:#eee}.btn.dark{background:#161616;color:white}.btn.tiny{padding:7px 10px;font-size:10px}.hero{background:linear-gradient(135deg,#111,#413a23);color:white;padding:24px 18px;border-radius:14px;min-height:130px;display:flex;flex-direction:column;justify-content:end}.hero h2{margin:12px 0 2px;font-size:23px}.chip{background:#ffda2a;color:#222;border-radius:50px;font-size:10px;font-weight:850;padding:5px 9px;width:max-content}.score{display:flex;align-items:center;justify-content:space-around;text-align:center;margin:16px 0}.crest{display:grid;place-items:center;width:51px;height:51px;border-radius:50%;background:#151515;color:#fbd62d;margin:auto auto 6px;font-size:22px;font-weight:950}.crest.other{background:#ded5c9;color:#8c572e}.num{font-size:28px;font-weight:950}.tabs{display:flex;background:#ececec;border-radius:10px;padding:3px;margin:12px 0;gap:3px}.tabs button{background:none;border:0;flex:1;border-radius:8px;padding:9px 4px;font-size:11px}.tabs button.active{background:#ffdc2e;font-weight:800}.line{display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid #eee;padding:12px 0}.line:last-child{border:0}.face{border-radius:50%;width:40px;height:40px;background:#ffdb2b;display:grid;place-items:center;font-weight:850;flex-shrink:0}.media{height:120px;background:repeating-linear-gradient(140deg,#161616,#161616 25px,#26241d 26px,#26241d 45px);color:#ffdc2e;display:grid;place-items:center;border-radius:10px;font-weight:900;font-size:13px}.field{display:block;width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;background:#fff;margin:9px 0;font-size:13px}table{width:100%;border-collapse:collapse;text-align:center;font-size:11px}th{background:#efefed;color:#777;padding:10px 3px}td{background:#fff;border-bottom:1px solid #eee;padding:12px 3px}.highlight td{background:#fff0b0;font-weight:850}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stats div{background:#f0f0ee;border-radius:9px;text-align:center;padding:13px 3px;font-size:11px}.stats strong{display:block;font-size:17px;margin-top:6px}.posttools{display:flex;justify-content:space-between;margin-top:12px}.posttools button{background:none;border:0;color:#777;font-size:12px}.bar{display:flex;justify-content:space-between;align-items:center;gap:10px}.back{border:0;background:none;color:white;font-size:25px;padding:0 8px 0 0}.screen-picker{max-width:390px;display:flex;gap:5px;overflow:auto;padding:9px 0}.screen-picker button{white-space:nowrap;border:1px solid #ddd;border-radius:20px;background:white;padding:7px 10px;font-size:11px}.screen-picker button.active{background:#1b1b1b;color:#ffd52e}p{line-height:1.7}
</style></head><body><div class="preview"><div><div class="bar" style="margin:0 0 6px"><strong>tramas モバイル画面カンプ</strong><span class="muted">操作用サンプル</span></div><div class="screen-picker" id="picker"></div><div class="phone"><div class="status"><b>9:41</b><span>●●● ▰</span></div><div class="header"><div class="bar"><button class="back" id="back">‹</button><span id="heading" class="logo">tramas</span></div><button class="back" data-page="settings">⚙</button></div><main class="content" id="screen"></main><nav class="nav" id="nav"></nav></div></div></div><script>
const screens=[['login','ログイン'],['register','新規登録'],['home','ホーム'],['games','試合'],['standings','順位'],['players','選手名鑑'],['player','選手詳細'],['stats','野球DB'],['articles','記事'],['article','記事詳細'],['social','SNS'],['post','投稿詳細'],['compose','投稿作成'],['profile','マイページ'],['favorite','推し選手'],['settings','設定']];const navs=[['home','⌂','ホーム'],['games','▦','試合'],['social','◎','SNS'],['players','♙','選手'],['profile','♟','マイページ']];let page='home',section='home',league='セ',kind='すべて',feed='みんな',liked=false,following=false;const el=document.getElementById('screen');function go(p){page=p;if(navs.some(n=>n[0]===p))section=p;draw()}const b=(s,p,cl='')=>`<button class="btn ${cl}" data-page="${p}">${s}</button>`;const t=(name)=>`<h3 class="section">${name}</h3>`;const game=()=>`<div class="card"><div class="muted" style="text-align:center">4/12 甲子園 · 試合終了（仮データ）</div><div class="score"><div><div class="crest">虎</div><b>阪神</b></div><div class="num">4 - 2</div><div><div class="crest other">G</div><b>巨人</b></div></div>${b('試合の詳細を見る','games')}</div>`;const post=(detail=false)=>`<div class="card"><div class="bar"><div class="bar"><div class="face">虎</div><div><b style="font-size:13px">虎ファン太郎</b><div class="muted">@tora_fan · 2時間前</div></div></div><button class="btn tiny secondary" data-action="follow">${following?'フォロー中':'フォロー'}</button></div><p style="font-size:13px">今日の甲子園も最高でした！次の試合も全力で応援します 🐯<br><span style="color:#b18d15">#阪神タイガース</span></p><div class="media" data-page="post">観戦写真（仮）</div><div class="posttools"><button data-action="like">${liked?'♥':'♡'} ${liked?129:128}</button><button data-page="post">♧ 24</button><button data-action="save">♢ 保存</button><button data-action="report">⋯</button></div>${detail?'<hr style="border:0;border-top:1px solid #eee"><b>コメント</b><p class="muted">虎子：次も勝ちましょう！</p><input class="field" placeholder="コメントを入力"><button class="btn tiny" data-action="sample">コメントする</button>':''}</div>`;function draw(){document.getElementById('heading').textContent=page==='home'?'tramas':screens.find(s=>s[0]===page)?.[1]||'tramas';document.getElementById('picker').innerHTML=screens.map(s=>`<button data-page="${s[0]}" class="${page===s[0]?'active':''}">${s[1]}</button>`).join('');document.getElementById('nav').innerHTML=navs.map(n=>`<button class="${section===n[0]?'active':''}" data-page="${n[0]}"><b>${n[1]}</b>${n[2]}</button>`).join('');let h='';switch(page){
case 'home':h=`<div class="hero"><span class="chip">TIGERS FAN COMMUNITY</span><h2>今日も、虎とともに。</h2><div style="font-size:11px;color:#ddd">試合も、記録も、ファンの声も。</div></div>${t('試合情報')}${game()}${t('最新の記事')}<div class="card" data-page="article"><span class="chip">試合レポート</span><h3>甲子園で見せた粘り強い戦いを振り返る</h3><div class="muted">tramas編集部 · サンプル</div></div>${b('記事一覧を見る','articles','secondary')}${t('ファンの声')}${post()}`;break;
case 'games':h=`<div class="tabs"><button class="active">4/11</button><button class="active">4/12</button><button>4/13</button></div>${game()}${t('イニングスコア')}<div class="card"><table><tr><th>球団</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th><th>計</th></tr><tr><td>阪神</td><td>0</td><td>1</td><td>0</td><td>2</td><td>1</td><td>4</td></tr><tr><td>巨人</td><td>0</td><td>0</td><td>1</td><td>1</td><td>0</td><td>2</td></tr></table></div><div class="card"><b>対象の試合区分</b><p class="muted">一軍・二軍、公式戦・交流戦・ポストシーズン・オープン戦などを想定</p></div>${b('順位表','standings')}`;break;
case 'standings':{let teams=league==='セ'?['阪神','巨人','DeNA','広島','中日','ヤクルト']:['ソフトバンク','日本ハム','オリックス','楽天','ロッテ','西武'];h=`<div class="tabs">${['セ','パ'].map(s=>`<button class="${league===s?'active':''}" data-league="${s}">${s}・リーグ</button>`).join('')}</div><div class="muted">デザイン用の仮データ</div><div class="card"><table><tr><th>位</th><th>球団</th><th>試</th><th>勝</th><th>敗</th><th>勝率</th></tr>${teams.map((n,i)=>`<tr class="${n==='阪神'?'highlight':''}"><td>${i+1}</td><td>${n}</td><td>12</td><td>${8-i}</td><td>${3+i}</td><td>.${727-i*91}</td></tr>`).join('')}</table></div>${b('野球データ','stats')}`;break}
case 'players':{let names=kind==='投手'?['投手 A','投手 B','投手 C']:kind==='野手'?['野手 A','野手 B','野手 C']:kind==='スタッフ'?['監督 A','コーチ B','コーチ C']:['投手 A','野手 B','野手 C','育成選手 D','監督 E','コーチ F'];h=`<input class="field" placeholder="選手・監督・コーチを検索"><div class="tabs">${['すべて','投手','野手','スタッフ'].map(n=>`<button data-kind="${n}" class="${kind===n?'active':''}">${n}</button>`).join('')}</div>${t('阪神タイガース')}<div class="card">${names.map((n,i)=>`<div class="line" data-page="player"><div class="face">${i+1}</div><div style="flex:1"><b>${n}</b><div class="muted">阪神・サンプル</div></div><span>›</span></div>`).join('')}</div>`;break}
case 'player':h=`<div class="hero"><span class="chip">TIGERS</span><h2>18　選手 A</h2><small>投手・右投右打（仮）</small></div>${t('選手プロフィール')}<div class="card"><div class="line">所属 <b>阪神タイガース</b></div><div class="line">登録 <b>支配下</b></div><div class="line">投打 <b>右投右打</b></div></div>${t('シーズン成績')}<div class="stats"><div>登板<strong>25</strong></div><div>防御率<strong>2.45</strong></div><div>勝利<strong>11</strong></div></div><p>${b('推し選手に追加','favorite')}</p>`;break;
case 'stats':h=`<div class="tabs"><button class="active">打撃</button><button data-action="sample">投手</button><button data-action="sample">チーム</button></div>${t('野球データベース')}<div class="card"><p class="muted">12球団、シーズン別のデータを想定</p><table><tr><th>選手</th><th>試合</th><th>打率</th><th>本塁打</th><th>打点</th></tr>${['選手 A','選手 B','選手 C'].map((s,i)=>`<tr data-page="player"><td>${s}</td><td>${120-i*8}</td><td>.${314-i*13}</td><td>${18-i*5}</td><td>${67-i*9}</td></tr>`).join('')}</table></div>`;break;
case 'articles':h=`<div class="hero"><span class="chip">TRAMAS JOURNAL</span><h2>虎をもっと深く知る。</h2></div>${t('記事・お知らせ')}${['甲子園で見せた粘り強い戦い','今週の試合日程をチェック','選手名鑑の更新について'].map((s,i)=>`<div class="card" data-page="article"><span class="chip">${i===2?'お知らせ':'記事'}</span><h3 style="font-size:14px">${s}</h3><div class="muted">tramas編集部　›</div></div>`).join('')}`;break;
case 'article':h=`<span class="chip">試合レポート</span><h2>甲子園で見せた粘り強い戦いを振り返る</h2><p class="muted">tramas編集部 / サンプル</p><div class="media">記事画像（仮）</div><p>この記事はデザイン確認用の本文です。運営による編集・承認後に公開する仕組みを想定しています。</p>${b('記事一覧へ','articles','secondary')}`;break;
case 'social':h=`<div class="tabs">${['みんな','フォロー中'].map(s=>`<button data-feed="${s}" class="${feed===s?'active':''}">${s}</button>`).join('')}</div>${b('＋ 投稿する','compose')}<div style="height:12px"></div>${feed==='フォロー中'&&!following?'<div class="card">フォロー中のユーザーがいません</div>':post()+post()}`;break;
case 'post':h=post(true);break;
case 'compose':h=`<div class="card"><div class="bar"><div class="face">Y</div><div style="flex:1"><b>あなたの投稿</b><div class="muted">みんなに公開</div></div></div><textarea class="field" rows="8" placeholder="今日の試合、推し選手、観戦の思い出など..."></textarea><div class="media" style="background:#faf4d9;color:#8b7517;border:2px dashed #d7be56">＋ 画像を追加（仮）</div><p>${b('投稿する','social')}</p><div class="muted">このデモでは投稿は保存されません。</div></div>`;break;
case 'profile':h=`<div class="hero"><h2>yokke</h2><span class="muted" style="color:#ddd">@tramas_user</span></div><p>阪神の試合を観るのが楽しみです！</p><div class="stats"><div>投稿<strong>42</strong></div><div>フォロー<strong>128</strong></div><div>フォロワー<strong>256</strong></div></div>${t('推し選手')}<div class="card"><div class="line"><b>選手 A</b><span class="chip">メイン</span></div><div class="line"><b>選手 B</b><span class="muted">推し選手</span></div>${b('推し選手を編集','favorite','secondary')}</div>${t('自分の投稿')}${post()}`;break;
case 'favorite':h=`${t('推し選手の管理')}<p class="muted">最大3人、メインは1人。退団選手は履歴として保持します。</p><div class="card"><div class="line">選手 A <span class="chip">メイン</span></div><div class="line">選手 B <span class="muted">登録中</span></div><div class="line" data-page="players">＋ 選手を追加　›</div></div>${b('マイページへ','profile')}`;break;
case 'settings':h=`${t('アカウント設定')}<div class="card">${['プロフィール編集','推し選手の管理','通知設定','プライバシー設定','ブロックしたユーザー','ヘルプ'].map((s,i)=>`<div class="line" data-page="${i===1?'favorite':'profile'}">${s}<span>›</span></div>`).join('')}</div>${b('ログアウト','login','secondary')}`;break;
case 'login':h=`<div class="hero" style="height:180px"><h2 style="font-size:38px;color:#ffdb25">tramas.</h2><p>阪神をもっと楽しむ、ファンの居場所。</p></div>${t('ログイン')}<input class="field" placeholder="メールアドレス"><input class="field" type="password" placeholder="パスワード">${b('ログイン','home')}<p>${b('Appleでログイン','home','dark')} ${b('Googleでログイン','home','secondary')}</p>${b('新規登録へ','register','secondary')}`;break;
case 'register':h=`${t('新規登録')}<input class="field" placeholder="メールアドレス"><input class="field" type="password" placeholder="パスワード"><input class="field" type="password" placeholder="パスワード確認">${b('登録（デモ）','profile')}<p class="muted">実際のアカウントは作成されません。</p>`;break}
el.innerHTML=h;el.scrollTop=0}document.addEventListener('click',e=>{const a=e.target.closest('[data-page],[data-action],[data-league],[data-kind],[data-feed]');if(!a)return;if(a.dataset.page)go(a.dataset.page);if(a.dataset.league){league=a.dataset.league;draw()}if(a.dataset.kind){kind=a.dataset.kind;draw()}if(a.dataset.feed){feed=a.dataset.feed;draw()}if(a.dataset.action==='like'){liked=!liked;draw()}if(a.dataset.action==='follow'){following=!following;draw()}if(a.dataset.action==='sample'||a.dataset.action==='report')alert('カンプの操作イメージです。実データの操作は行いません。');if(a.dataset.action==='save')a.textContent='◆ 保存済み'});document.getElementById('back').onclick=()=>go(section);draw();
</script></body></html>
