<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>tramas Admin Mockup</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f6f8;color:#24282f;font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN",sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}.layout{display:flex;min-height:100vh}.sidebar{width:226px;background:#17191e;color:#adb4c1;padding:20px 12px;display:flex;flex-direction:column;flex-shrink:0}.logo{color:#ffdc2b;font-size:30px;font-weight:950;letter-spacing:-1.5px;padding-left:12px}.logo small{display:block;color:#9299a5;font-size:10px;letter-spacing:1.5px}.group{font-size:10px;letter-spacing:1px;color:#7c8593;margin:22px 10px 8px;font-weight:850}.menu{width:100%;border:0;background:transparent;color:#bac0c8;text-align:left;border-radius:8px;padding:12px;font-size:12px}.menu.active{background:#36352b;color:#ffdd38;border-left:3px solid #ffdc2b}.main{flex:1;min-width:0}.top{height:68px;background:white;border-bottom:1px solid #e5e8ec;display:flex;align-items:center;justify-content:space-between;padding:0 25px}.content{padding:26px;max-width:1500px;margin:auto}.muted{color:#87909e;font-size:11px}.title{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:22px}.title h1{font-size:23px;letter-spacing:-.5px;margin:0 0 5px}.btn{border:1px solid #eac223;border-radius:7px;background:#ffda31;padding:10px 14px;font-size:12px;font-weight:800}.btn.secondary{border-color:#e1e5eb;background:white;color:#444}.btn.dark{background:#25282e;border-color:#25282e;color:white}.btn.danger{background:#fff0ed;border-color:#ffdad6;color:#b33532}.btn.small{padding:7px 10px;font-size:10px}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px;margin-bottom:20px}.card{background:white;border:1px solid #e6e8ec;border-radius:11px;padding:18px;margin-bottom:15px}.card.stat strong{display:block;font-size:30px;letter-spacing:-1px;margin:6px 0}.columns{display:grid;grid-template-columns:1.25fr 1fr;gap:15px}.field{width:100%;border:1px solid #dfe3e9;border-radius:8px;background:white;padding:11px;font-size:12px;margin:6px 0 15px}.field.short{width:auto;min-width:170px}.section{font-size:14px;font-weight:850;margin:0 0 15px}.tablebox{background:white;border:1px solid #e5e8ec;border-radius:10px;overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap;text-align:left;font-size:12px}th{background:#fafafb;color:#7e8793;font-size:11px;padding:13px;border-bottom:1px solid #eee}td{padding:15px 13px;border-bottom:1px solid #eff0f3}tr:last-child td{border-bottom:0}.tag{display:inline-block;border-radius:6px;padding:5px 8px;background:#edf2ff;color:#4463a4;font-size:10px;font-weight:800}.tag.warn{background:#fff2bc;color:#8b6b00}.tag.good{background:#e3f5e9;color:#2a7946}.tag.bad{background:#ffe5e2;color:#b83b33}.item{padding:12px 0;border-bottom:1px solid #eee;display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:12px}.item:last-child{border:0}.notice{background:#fff7df;border:1px solid #f2e4aa;border-radius:8px;padding:12px;color:#735b16;font-size:12px;margin-bottom:16px}.tabs{display:flex;gap:6px;margin:0 0 15px;flex-wrap:wrap}.tabs button{background:white;border:1px solid #e5e5e5;border-radius:8px;padding:8px 12px;font-size:11px}.tabs button.active{background:#ffda31;border-color:#ffda31;font-weight:800}.preview-cover{background:linear-gradient(135deg,#151515,#514523);display:grid;place-items:center;color:#ffdf3d;font-size:34px;height:165px;font-weight:950;border-radius:9px}.rolegrid{display:grid;grid-template-columns:1.2fr repeat(4,1fr);font-size:11px}.rolegrid div{padding:13px 6px;border-bottom:1px solid #eee;text-align:center}.rolegrid div:nth-child(5n+1){text-align:left;font-weight:800}.rolegrid .yes{color:#188d4f}.rolegrid .no{color:#bbc1c9}.bars{display:flex;align-items:end;height:160px;gap:12px;border-bottom:1px solid #eee}.bars span{flex:1;background:linear-gradient(#ffdf52,#efbd0a);border-radius:5px 5px 0 0}.toast{position:fixed;bottom:20px;right:20px;padding:13px 17px;background:#1d1e22;color:white;border-radius:9px;font-size:12px;box-shadow:0 10px 25px #0003}@media(max-width:850px){.sidebar{width:66px;padding:15px 5px}.logo{font-size:12px;padding:2px}.logo small,.group,.menulabel{display:none}.menu{text-align:center;font-size:16px}.cards{grid-template-columns:repeat(2,1fr)}.columns{grid-template-columns:1fr}.content{padding:14px}.top{padding:0 14px}}
</style></head><body><div class="layout"><aside class="sidebar"><div class="logo">tramas<small>ADMIN CONSOLE</small></div><div class="group">OVERVIEW</div><button class="menu active" data-page="dashboard">▦ <span class="menulabel">ダッシュボード</span></button><div class="group">DATA MANAGEMENT</div><button class="menu" data-page="players">♟ <span class="menulabel">選手・スタッフ</span></button><button class="menu" data-page="games">▣ <span class="menulabel">試合・スコア</span></button><button class="menu" data-page="standings">▤ <span class="menulabel">順位・成績</span></button><div class="group">CONTENT & COMMUNITY</div><button class="menu" data-page="articles">▧ <span class="menulabel">記事管理</span></button><button class="menu" data-page="ai">✧ <span class="menulabel">AI収集・下書き</span></button><button class="menu" data-page="reports">⚑ <span class="menulabel">通報・投稿管理</span></button><button class="menu" data-page="users">♙ <span class="menulabel">ユーザー管理</span></button><div class="group">SYSTEM</div><button class="menu" data-page="roles">⚙ <span class="menulabel">権限・管理者</span></button><div style="margin-top:auto;font-size:11px;color:#ffdc2b;padding:12px">● デザインカンプ</div></aside><div class="main"><header class="top"><b id="page-name">ダッシュボード</b><div class="muted">DEMO　｜　システム管理者 ▾</div></header><main class="content" id="content"></main></div></div><script>
let page='dashboard',selected=0,filter='all';const names={dashboard:'ダッシュボード',players:'選手・スタッフ管理',games:'試合・スコア管理',standings:'順位・成績',articles:'記事管理',ai:'AI収集・下書き',reports:'通報・投稿管理',users:'ユーザー管理',roles:'権限・管理者',editor:'記事編集',aiDetail:'AI候補確認',reportDetail:'通報詳細',gameEdit:'試合データ確認',playerEdit:'選手データ編集',userDetail:'ユーザー詳細'};const articles=[{title:'甲子園の熱戦を振り返る',type:'試合記事',status:'承認待ち'},{title:'今週の試合日程まとめ',type:'特集',status:'下書き'},{title:'選手データ更新のお知らせ',type:'お知らせ',status:'承認待ち'},{title:'秋季練習の注目ポイント',type:'特集',status:'公開中'}];const games=[{date:'04/12',type:'一軍公式戦',opp:'巨人',score:'4 - 2',status:'承認済み'},{date:'04/13',type:'一軍公式戦',opp:'巨人',score:'3 - 1',status:'承認待ち'},{date:'04/14',type:'一軍公式戦',opp:'ヤクルト',score:'未入力',status:'未入力'},{date:'04/15',type:'二軍公式戦',opp:'オリックス',score:'2 - 3',status:'下書き'}];const ai=[{topic:'試合情報の更新候補',source:'許可済みソース A',status:'確認待ち'},{topic:'選手登録情報の更新候補',source:'許可済みソース B',status:'確認待ち'},{topic:'記事見出し案の生成結果',source:'運営入力テキスト',status:'下書き'}];const reports=[{reason:'不適切な表現',target:'投稿 #1428',status:'未対応'},{reason:'スパムの疑い',target:'投稿 #1402',status:'未対応'},{reason:'嫌がらせ',target:'コメント #781',status:'調査中'}];const btn=(s,action,cl='')=>`<button class="btn ${cl}" data-action="${action}">${s}</button>`;const heading=(s,sub,action='')=>`<div class="title"><div><h1>${s}</h1><div class="muted">${sub}</div></div>${action}</div>`;const tag=s=>`<span class="tag ${['承認待ち','確認待ち','未対応','調査中'].includes(s)?'warn':['公開中','承認済み','対応済み','採用済み'].includes(s)?'good':s==='却下'?'bad':''}">${s}</span>`;const tab=(labels)=>`<div class="tabs">${labels.map(s=>`<button data-filter="${s}" class="${filter===s?'active':''}">${s==='all'?'すべて':s}</button>`).join('')}</div>`;const table=(cols,rows)=>`<div class="tablebox"><table><tr>${cols.map(c=>'<th>'+c+'</th>').join('')}</tr>${rows.map(r=>'<tr>'+r.map(c=>'<td>'+c+'</td>').join('')+'</tr>').join('')}</table></div>`;function navigate(p){page=p;filter='all';render()}function toast(s){let v=document.createElement('div');v.className='toast';v.textContent=s;document.body.appendChild(v);setTimeout(()=>v.remove(),2400)}function render(){document.querySelectorAll('.menu').forEach(m=>m.classList.toggle('active',m.dataset.page===page));document.getElementById('page-name').textContent=names[page];let h='';switch(page){
case 'dashboard':h=heading('ダッシュボード','tramasの運用状況',btn('＋ 記事作成','newArticle'))+`<div class="cards">${[['登録ユーザー','2,846'],['本日の投稿','128'],['承認待ち記事',articles.filter(a=>a.status==='承認待ち').length],['未対応の通報',reports.filter(a=>a.status==='未対応').length]].map(x=>`<div class="card stat"><span class="muted">${x[0]}</span><strong>${x[1]}</strong><span class="muted">仮データ</span></div>`).join('')}</div><div class="columns"><div class="card"><h3 class="section">投稿アクティビティ（仮）</h3><div class="bars">${[55,65,42,81,62,95,75].map(v=>`<span style="height:${v}%"></span>`).join('')}</div><div class="muted" style="margin-top:9px">月　　火　　水　　木　　金　　土　　日</div></div><div class="card"><h3 class="section">確認が必要な作業</h3><div class="item" data-page="articles">▤　記事の承認 <b>${articles.filter(a=>a.status==='承認待ち').length}件 ›</b></div><div class="item" data-page="ai">✧　AI収集候補 <b>${ai.filter(a=>a.status==='確認待ち').length}件 ›</b></div><div class="item" data-page="reports">⚑　コミュニティ通報 <b>${reports.filter(a=>a.status==='未対応').length}件 ›</b></div></div></div><div class="notice">AI生成・試合結果・記事は、確認・承認後に公開する運用を想定しています。</div>`;break;
case 'players':h=heading('選手・スタッフ管理','支配下・育成・監督・コーチ',btn('＋ 新規登録','newPlayer'))+`<input class="field short" id="search" placeholder="名前・背番号で検索">`+table(['背番号','名前','登録区分','役割','状態','操作'],[['18','選手 A','支配下','投手'],['5','選手 B','支配下','内野手'],['126','選手 C','育成','投手'],['90','コーチ D','スタッフ','コーチ'],['—','監督 E','スタッフ','監督']].map(r=>[...r,tag('公開中'),btn('編集','editPlayer','small secondary')]));break;
case 'games':h=heading('試合・スコア管理','登録・確認・承認後に公開',btn('＋ 試合を登録','newGame'))+table(['日付','区分','対戦相手','スコア','状態','操作'],games.map((g,i)=>[g.date,g.type,g.opp,g.score,tag(g.status),`<button class="btn small secondary" data-game="${i}">確認・編集</button>`]));break;
case 'standings':h=heading('順位・成績','承認済みの結果から自動集計する設計')+`<div class="notice">以下は仮データです。実際の順位は承認済み試合結果から計算します。</div>`+table(['順位','球団','試合','勝','敗','勝率'],['阪神','巨人','DeNA','広島','中日','ヤクルト'].map((n,i)=>[i+1,n,12,8-i,3+i,'.'+(727-91*i)]));break;
case 'articles':h=heading('記事管理','編集・承認・公開の状態を管理',btn('＋ 新しい記事','newArticle'))+tab(['all','下書き','承認待ち','公開中'])+table(['記事タイトル','分類','担当者','状態','操作'],articles.map((a,i)=>({...a,i})).filter(x=>filter==='all'||x.status===filter).map(a=>[a.title,a.type,'編集担当',tag(a.status),`<button class="btn small secondary" data-article="${a.i}">編集・確認</button>`]));break;
case 'editor':{let a=articles[selected]||articles[0];h=heading('記事編集','下書きから承認・公開まで',btn('記事一覧へ','articles','secondary'))+`<div class="columns"><div class="card"><label>記事タイトル</label><input class="field" id="article-title" value="${a.title.replace(/"/g,'&quot;')}"><label>カテゴリ</label><select class="field"><option>${a.type}</option><option>ニュース</option><option>お知らせ</option></select><label>記事本文</label><textarea class="field" rows="12">ここに本文を入力します。AI生成した内容も、人間が事実確認してから公開します。</textarea>${btn('下書き保存','saveDraft','secondary')} ${btn('承認を依頼','requestApproval')} ${btn('承認して公開','publishArticle','dark')}</div><div class="card"><h3 class="section">公開プレビュー</h3><div class="preview-cover">tramas</div><h3>${a.title}</h3>${tag(a.status)}<p class="muted">実際の記事は公開されません。</p></div></div>`;break}
case 'ai':h=heading('AI収集・下書き','自動公開せず、担当者の確認を必須とする')+`<div class="notice">情報源の利用条件、著作権、正確性を確認してから採用します。</div>`+table(['候補','情報源','状態','操作'],ai.map((a,i)=>[a.topic,a.source,tag(a.status),`<button class="btn small secondary" data-ai="${i}">内容確認</button>`]));break;
case 'aiDetail':{let a=ai[selected];h=heading('AI候補確認','採用前の検証',btn('一覧へ','ai','secondary'))+`<div class="columns"><div class="card"><h3>${a.topic}</h3><p>AIによる収集・整理の候補を表示する領域です。実際の収集・生成は行っていません。</p>${btn('下書きに採用','acceptAI')} ${btn('却下','rejectAI','danger')}</div><div class="card"><h3 class="section">出典情報</h3><p>${a.source}</p>${tag(a.status)}</div></div>`;break}
case 'reports':h=heading('通報・投稿管理','内容を確認し対応履歴を管理')+tab(['all','未対応','調査中','対応済み'])+table(['通報ID','理由','対象','状態','操作'],reports.map((r,i)=>({...r,i})).filter(x=>filter==='all'||x.status===filter).map(r=>[501+r.i,r.reason,r.target,tag(r.status),`<button class="btn small secondary" data-report="${r.i}">調査・対応</button>`]));break;
case 'reportDetail':{let r=reports[selected];h=heading('通報内容の確認','モデレーション判断',btn('一覧へ','reports','secondary'))+`<div class="columns"><div class="card"><h3>${r.reason}</h3><p>対象：${r.target}</p><p>状態：${tag(r.status)}</p><textarea class="field" rows="4" placeholder="対応判断の記録"></textarea>${btn('調査中にする','investigate','secondary')} ${btn('対応済みにする','resolve')} ${btn('非公開措置','hide','danger')}</div><div class="card"><h3 class="section">対象コンテンツ</h3><p class="muted">実運用では通報対象の本文・画像・履歴を確認します。</p></div></div>`;break}
case 'users':h=heading('ユーザー管理','利用状況・アカウントの管理')+table(['ID','ニックネーム','投稿数','状態','操作'],[['1024','虎ファン太郎',42,'有効'],['1025','甲子園好き',18,'有効'],['1026','TigersFan',7,'制限中']].map(r=>[...r.slice(0,3),tag(r[3]),btn('詳細','userDetail','small secondary')]));break;
case 'roles':{let rows=[['選手・試合データ','✓','✓','—','—'],['記事の作成・公開','✓','—','✓','—'],['通報・投稿対応','✓','—','—','✓'],['ユーザー管理','✓','—','—','✓'],['権限・管理者設定','✓','—','—','—']];h=heading('権限・管理者','4種類の管理ロール',btn('管理者を追加','addAdmin'))+`<div class="notice">管理者アカウントは一般ユーザーとは分離し、MFA必須とする設計です。</div><div class="card"><h3 class="section">ロール別アクセス権限（案）</h3><div class="rolegrid">${[['機能','システム','データ','コンテンツ','モデレーター'],...rows].flatMap(r=>r.map(v=>`<div class="${v==='✓'?'yes':v==='—'?'no':''}">${v}</div>`)).join('')}</div></div>`;break}
case 'gameEdit':{let g=games[selected];h=heading('試合データの確認','入力した情報を承認',btn('一覧へ','games','secondary'))+`<div class="card"><label>試合日</label><input class="field" value="${g.date}"><label>対戦相手</label><input class="field" value="${g.opp}"><label>スコア</label><input class="field" value="${g.score}">${btn('下書き保存','saveGame','secondary')} ${btn('承認して公開','approveGame')}</div>`;break}
default:h=heading(names[page]||'詳細','詳細画面のデザイン確認',btn('戻る','dashboard','secondary'))+`<div class="card"><label>内容</label><input class="field" placeholder="編集項目">${btn('保存（デモ）','mockSave')}</div>`}document.getElementById('content').innerHTML=h}document.addEventListener('click',e=>{let b=e.target.closest('[data-page],[data-action],[data-article],[data-game],[data-ai],[data-report],[data-filter]');if(!b)return;if(b.dataset.page){navigate(b.dataset.page);return}if(b.dataset.filter){filter=b.dataset.filter;render();return}for(let k of ['article','game','ai','report'])if(b.dataset[k]!==undefined){selected=+b.dataset[k];navigate({article:'editor',game:'gameEdit',ai:'aiDetail',report:'reportDetail'}[k]);return}let a=b.dataset.action;if(!a)return;let go={articles:'articles',games:'games',players:'players',ai:'ai',reports:'reports',newPlayer:'playerEdit',editPlayer:'playerEdit',userDetail:'userDetail'};if(go[a]){navigate(go[a]);return}if(a==='newArticle'){articles.unshift({title:'新しい記事',type:'記事',status:'下書き'});selected=0;navigate('editor');return}if(a==='newGame'){games.unshift({date:'未設定',type:'一軍公式戦',opp:'未設定',score:'未入力',status:'下書き'});selected=0;navigate('gameEdit');return}if(['saveDraft','requestApproval','publishArticle'].includes(a)){articles[selected].title=document.getElementById('article-title').value;articles[selected].status=a==='saveDraft'?'下書き':a==='requestApproval'?'承認待ち':'公開中';render();toast('カンプ内で状態を更新しました');return}if(['approveGame','saveGame'].includes(a)){games[selected].status=a==='approveGame'?'承認済み':'下書き';render();toast('カンプ内で状態を更新しました');return}if(['acceptAI','rejectAI'].includes(a)){ai[selected].status=a==='acceptAI'?'採用済み':'却下';render();toast('候補状態を変更しました');return}if(['investigate','resolve','hide'].includes(a)){reports[selected].status=a==='investigate'?'調査中':'対応済み';render();toast('通報状態を変更しました');return}toast('デモ画面です。実データは変更されません')});render();
</script></body></html>
